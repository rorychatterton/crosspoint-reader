[platformio]
default_envs = qemu_v6
src_dir = src
lib_dir = ../../lib
build_cache_dir = ../../.cache

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 4MB
lib_ldf_mode = deep+
; DERP TLS: the device ships wolfSSL (see lib/MicroLink/src/ml_derp.c), but
; QEMU's emulated ESP32-C3 RNG cannot seed wolfSSL's DRBG (wc_InitRng returns
; -199 even with ample heap), while it does seed mbedTLS. So the harness builds
; the mbedTLS DERP backend; it exercises the DERP protocol, HTTP upgrade,
; WireGuard-over-DERP and the tunnel data path the same way. The wolfSSL
; handshake itself is validated on hardware, where the real TRNG works.
build_flags =
  -DWIREGUARD_CRYPTO_REFC=1
  -I../../lib/WireGuardLwip/src/crypto/refc
  -DCONFIG_ML_MAX_PEERS=4
  -DCONFIG_ML_NVS_MAX_PEERS=4
  -DCONFIG_ML_H2_BUFFER_SIZE_KB=16
  -DCONFIG_ML_JSON_BUFFER_SIZE_KB=16
  -DML_QEMU_HEAP_TARGET_BYTES=80000
  ; Relay served by control_fixture over TLS; guestfwd in run_integration.sh
  ; maps this address to 127.0.0.1:18443 on the host.
  -DML_DERP_HOST=\"10.0.2.100\"
  -DML_DERP_PORT=18443
  ; The fixture's map assigns HomeDERP 9; without this the client would derive
  ; derp9.tailscale.com instead of using the local relay above.
  -DML_DERP_USE_REGION_HOST=0
  -Wno-stringop-overread

[env:qemu_v6]
extends = base

[env:qemu_v6_full]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_FULL_MAP_TEST=1

[env:qemu_v6_routed]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_ROUTED_TARGET_TEST=1

[env:qemu_v6_resolver]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_RESOLVER_TEST=1

[env:qemu_v6_resolver_late]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_RESOLVER_LATE_TEST=1

[env:qemu_v6_resolver_absent]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_RESOLVER_ABSENT_TEST=1

[env:qemu_v6_restart]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_RESTART_TEST=1

[env:qemu_v6_stalled]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_STALLED_MAP_TEST=1

[env:qemu_v6_missing]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_MISSING_TARGET_TEST=1

[env:qemu_v6_malformed]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_MALFORMED_MAP_TEST=1

[env:qemu_eager]
extends = base
build_flags =
  ${base.build_flags}
  -DML_EAGER_DATA_PLANE_TEST=1
  -DML_QEMU_POST_START_HEAP_TARGET_BYTES=4200

; 1 MiB GET /bulk through the tunnel after the early-map data-plane stages,
; verified byte for byte against the regenerated stream. The lossy variant is
; the same firmware under a fixture started with FIXTURE_DROP_PCT/DUP/REORDER.
[env:qemu_v6_bulk]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_BULK_TEST=1

[env:qemu_v6_bulk_lossy]
extends = base
build_flags =
  ${base.build_flags}
  -DML_QEMU_BULK_TEST=1
  -DML_QEMU_BULK_LOSSY_TEST=1
